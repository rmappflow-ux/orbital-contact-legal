<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbital Contact — Download</title>
<meta name="description" content="Orbital Contact for iPhone and Android.">
<style>:root{--bg:#f6f7fb;--surface:#fff;--fg:#141826;--muted:#5d6475;--line:#dde1ea;--accent:#0b8fb3}
@media (prefers-color-scheme:dark){:root{--bg:#05070d;--surface:#0e1320;--fg:#e8eef2;--muted:#9aa4b5;--line:#232a3a;--accent:#22d3ee}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:48px 20px 64px;text-align:center}
.brand{font-weight:700;letter-spacing:.02em;color:var(--accent);font-size:14px;text-transform:uppercase}
h1{font-size:28px;line-height:1.25;margin:8px 0 8px}p{color:var(--muted);margin:0 0 28px}
.buttons{display:flex;flex-direction:column;gap:12px;align-items:center}
.buttons a{display:block;width:100%;max-width:320px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;border-radius:14px;padding:14px 18px;font-weight:600}
.buttons a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{margin-top:40px;font-size:13px;color:var(--muted)}footer a{color:var(--accent)}</style>
<script>
/* One link for sharing: a phone goes straight to its store; a computer sees both buttons. */
(function () {
  var ios = 'https://apps.apple.com/app/id6783121636';
  var android = 'https://play.google.com/store/apps/details?id=com.orbitalcontact.app';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) location.replace(ios);
  else if (/Android/i.test(ua)) location.replace(android);
})();
</script></head>
<body><div class="wrap">
<div class="brand">Orbital Contact</div>
<h1 id="t">Get Orbital Contact</h1>
<p id="s">The sky above you, live — planets, the ISS, launches and more.</p>
<div class="buttons">
<a href="https://apps.apple.com/app/id6783121636" id="ios">App Store (iPhone)</a>
<a href="https://play.google.com/store/apps/details?id=com.orbitalcontact.app" id="android">Google Play (Android)</a>
</div>
<footer><a href="../privacy/">Privacy</a> · <a href="../terms/">Terms</a></footer>
</div>
<script>
/* Page text in the visitor's language (EN · PT · ES · FR). */
(function () {
  var L = {
    pt: ['Baixe o Orbital Contact', 'O céu acima de você, ao vivo — planetas, a ISS, lançamentos e mais.', 'Privacidade', 'Termos'],
    es: ['Descarga Orbital Contact', 'El cielo sobre ti, en vivo: planetas, la ISS, lanzamientos y más.', 'Privacidad', 'Términos'],
    fr: ['Téléchargez Orbital Contact', 'Le ciel au-dessus de vous, en direct : planètes, l’ISS, lancements et plus.', 'Confidentialité', 'Conditions']
  };
  var l = L[(navigator.language || 'en').slice(0, 2)];
  if (!l) return;
  document.documentElement.lang = (navigator.language || 'en').slice(0, 2);
  document.getElementById('t').textContent = l[0];
  document.getElementById('s').textContent = l[1];
  var f = document.querySelectorAll('footer a');
  f[0].textContent = l[2];
  f[1].textContent = l[3];
})();
</script>
</body></html>
