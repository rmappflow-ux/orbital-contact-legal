<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbital Contact — Legal</title><style>:root{--bg:#f6f7fb;--surface:#fff;--fg:#141826;--muted:#5d6475;--line:#dde1ea;--accent:#0b8fb3}
@media (prefers-color-scheme:dark){:root{--bg:#05070d;--surface:#0e1320;--fg:#e8eef2;--muted:#9aa4b5;--line:#232a3a;--accent:#22d3ee}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}header{margin-bottom:24px}
.brand{font-weight:700;letter-spacing:.02em;color:var(--accent);font-size:14px;text-transform:uppercase}
h1{font-size:26px;line-height:1.25;margin:6px 0 0}
nav.langs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
nav.langs a{border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;border-radius:999px;padding:6px 14px;font-size:14px}
nav.langs a:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.lang{border-top:1px solid var(--line);padding-top:24px;margin-top:32px}
h2{font-size:22px;margin:0 0 4px}.updated{color:var(--muted);font-size:14px;margin:0 0 16px}
h3{font-size:17px;margin:24px 0 6px}p{margin:0 0 12px}ul{margin:0 0 12px;padding-left:22px}li{margin:0 0 6px}
a{color:var(--accent)}table{width:100%;border-collapse:collapse;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--surface)}
.table-wrap{overflow-x:auto}footer{margin-top:40px;font-size:13px;color:var(--muted)}</style></head>
<body><div class="wrap"><header><div class="brand">Orbital Contact</div><h1>Legal</h1></header>
<ul><li><a href="privacy/">Privacy Policy (iPhone)</a></li><li><a href="privacy-android/">Privacy Policy (Android)</a></li><li><a href="terms/">Terms of Use</a></li><li><a href="delete-data/">Delete your data</a></li><li><a href="app/">Download the app</a></li></ul>
<footer>EN · PT · ES · FR</footer></div></body></html>
